aid: national-archives-and-records-administration
name: National Archives and Records Administration
description: >-
  The National Archives Catalog API is a read-write web API for the National Archives Catalog. This API can be used to
  perform fielded search of archival metadata, bulk export of metadata and digital media, and post contributions to
  records.
